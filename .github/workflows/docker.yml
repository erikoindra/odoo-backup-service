name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh tools/*.sh
      - name: Portainer template is valid JSON
        run: python3 -m json.tool templates/portainer.json > /dev/null
      - name: stack compose file parses
        run: |
          PGHOST=db PGUSER=odoo PGPASSWORD=x ODOO_DATA_VOLUME=data DB_NETWORK=net \
            docker compose -f stacks/odoo-backup/docker-compose.yml config -q
      - name: build test image (PostgreSQL 17)
        run: docker build --build-arg PG_MAJOR=17 --build-arg ALPINE_VERSION=3.23 -t odoo-backup-service:test .
      - name: smoke test
        run: PG_MAJOR=17 tests/smoke.sh odoo-backup-service:test

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "14", alpine: "3.20" }
          - { pg: "15", alpine: "3.22" }
          - { pg: "16", alpine: "3.23" }
          - { pg: "17", alpine: "3.23" }
          - { pg: "18", alpine: "3.23" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # v1.2.3 tag -> pgNN, pgNN-1.2, pgNN-1.2.3   push to main/master -> pgNN-edge
          tags: |
            type=raw,value=pg${{ matrix.pg }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},prefix=pg${{ matrix.pg }}-
            type=semver,pattern={{version}},prefix=pg${{ matrix.pg }}-
            type=raw,value=pg${{ matrix.pg }}-edge,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PG_MAJOR=${{ matrix.pg }}
            ALPINE_VERSION=${{ matrix.alpine }}
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pg${{ matrix.pg }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg }}
